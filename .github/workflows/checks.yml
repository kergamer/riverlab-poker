name: RIVERLAB - verificaciones de motor
on:
  push:
    branches:
      - main
      - fix/v032-integrity-audit
      - feat/v033-sound-design
      - fix/v034-audio-activation
      - feat/v035-sonic-atelier
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verificar Node.js
        run: node --version
      - name: Regresiones de reglas y datos
        run: node --test tests/smoke.test.cjs tests/sound.test.cjs
