name: RIVERLAB - verificaciones de motor
on:
  push:
    branches:
      - main
      - fix/v032-integrity-audit
      - feat/v033-sound-design
      - fix/v034-audio-activation
      - feat/v035-sonic-atelier
      - dev/v040-strategy-learning
      - audit/v041-bot-performance
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verificar Node.js
        run: node --version
      - name: Regresiones de reglas y datos
        run: node --test tests/smoke.test.cjs tests/sound.test.cjs tests/bots.test.cjs tests/bots.stress.test.cjs tests/bots.game-sim.test.cjs

  bot-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        difficulty: [beginner, intermediate, advanced, expert]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Benchmark paired scenarios
        env:
          BENCH_LEVEL: ${{ matrix.difficulty }}
        run: node tests/benchmark_v041_scenarios.cjs | tee benchmark-output.log
      - name: Upload raw audit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bot-audit-${{ matrix.difficulty }}
          path: benchmark-output.log
          retention-days: 14

  tournament-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [loose-passive, tight-passive, tag, lag, balanced]
        level: [beginner, intermediate, advanced, expert]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 900 independent hands per opponent style
        env:
          BOT_KIND: ${{ matrix.kind }}
          BOT_LEVEL: ${{ matrix.level }}
          BENCH_HANDS: "900"
        run: node tests/benchmark_v041_tournament.cjs | tee tournament.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tournament-${{ matrix.kind }}-${{ matrix.level }}
          path: tournament.log
          retention-days: 14
